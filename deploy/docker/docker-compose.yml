name: ${COMPOSE_PROJECT_NAME:-multitenants}

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:-multitenant}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD PING | grep PONG"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    #   # Uncomment to expose for host redis-cli:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:3.12.2-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache curl

        curl -fSL \
          "https://github.com/rabbitmq/rabbitmq-delayed-message-exchange/releases/download/v3.12.0/rabbitmq_delayed_message_exchange-3.12.0.ez" \
          -o /plugins/rabbitmq_delayed_message_exchange.ez

        rabbitmq-plugins enable --offline rabbitmq_delayed_message_exchange

        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmqctl", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin123
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: "true"
      # The admin and dashboard PUT uploads cross-origin to presigned URLs on this store.
      # RUSTFS_CORS_ALLOWED_ORIGINS: ${ADMIN_URL},${DASHBOARD_URL}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    # The S3 API is published because browsers reach it directly through the
    # presigned URLs the API hands out (FSH_S3_PUBLIC_URL). This binds all
    # interfaces: firewall the port, or when your proxy runs on this host bind
    # it to loopback instead ("127.0.0.1:${FSH_S3_PORT:-9000}:9000") so only
    # the proxy can reach it. Uncomment the console (admin UI) line to expose it too:
    # ports:
    #   - "${APP_S3_PORT:-9000}:9000" # S3 API
    #   - "9001:9001"   # Web console
    ports:
      - "127.0.0.1:${APP_S3_PORT:-9000}:9000"
      - "127.0.0.1:${APP_S3_CONSOLE_PORT:-9001}:9001"

  # One-shot: create the bucket the Files module writes to and open public/*
  # to anonymous reads. The app never auto-creates the bucket (S3StorageService
  # just PutObjects into Storage:S3:Bucket), so without this the first upload
  # fails with NoSuchBucket. Visibility lives in the object key: public files
  # go under public/ and are served straight from ${FSH_S3_PUBLIC_URL}/fsh/...;
  # everything else (private/, and keys from before public/ existed) needs a
  # presigned URL. Re-applied on every `up`, so it also narrows older policies.
  rustfs-init:
    image: amazon/aws-cli:2.39.3
    restart: "no"
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-multitenants}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        BUCKET="$$S3_BUCKET"

        aws --endpoint-url http://rustfs:9000 \
          s3api head-bucket --bucket "$$BUCKET" 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 \
          s3api create-bucket --bucket "$$BUCKET"

        cat > /tmp/bucket-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::$$BUCKET/public/*"
            }
          ]
        }
        EOF

        aws --endpoint-url http://rustfs:9000 \
          s3api put-bucket-policy \
          --bucket "$$BUCKET" \
          --policy file:///tmp/bucket-policy.json

        echo "RustFS bucket $$BUCKET initialized successfully"

  migrator:
    build:
      context: ../..
      dockerfile: src/Host/MultitenantStarter.DbMigrator/Dockerfile
    image: multitenants/dbmigrator:${IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:?Set APP_ENVIRONMENT}
      DatabaseOptions__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-multitenant};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Minimum Pool Size=5"
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
      Seed__Demo: ${SEED_DEMO:-false}
    command: ["apply", "--seed"]

  api:
    build:
      context: ../..
      dockerfile: src/Host/MultitenantStarter.Api/Dockerfile
      target: ${API_BUILD_TARGET:-final}
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Release}

    image: multitenants/api:${IMAGE_TAG:-local}
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080

      DatabaseOptions__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-multitenant};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Minimum Pool Size=5"

      CachingOptions__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      QuotaOptions__Redis: "redis:6379,password=${REDIS_PASSWORD}"

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      JwtOptions__SigningKey: ${JWT_SIGNING_KEY:?Required}

      HangfireOptions__Username: ${HANGFIRE_USERNAME:?Required}
      HangfireOptions__Password: ${HANGFIRE_PASSWORD:?Required}

      Storage__Provider: S3
      Storage__S3__ServiceUrl: http://rustfs:9000
      Storage__S3__Bucket: ${S3_BUCKET:-multitenants}
      Storage__S3__AccessKey: ${RUSTFS_ACCESS_KEY}
      Storage__S3__SecretAccessKey: ${RUSTFS_SECRET_KEY}
      Storage__S3__ForcePathStyle: "true"
      Storage__S3__PresignEndpoint: ${S3_PUBLIC_ENDPOINT:-}

      MailOptions__Provider: smtp
      MailOptions__From: ${MAIL_FROM:?Required}
      MailOptions__SMTP__Host: ${SMTP_HOST:?Required}
      MailOptions__SMTP__Port: ${SMTP_PORT:-587}
      MailOptions__SMTP__UserName: ${SMTP_USERNAME:-}
      MailOptions__SMTP__Password: ${SMTP_PASSWORD:-}

      OpenTelemetryOptions__Exporter__Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  rustfs_data:
